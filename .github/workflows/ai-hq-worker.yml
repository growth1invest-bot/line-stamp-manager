name: AI HQ safe task worker
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      department:
        description: "Department to inspect"
        type: choice
        options: [all, video, video-dev, sticker, emoji, ios]
        default: all
      issue_number:
        description: "Issue number to report to (optional)"
        required: false
        type: string
permissions:
  contents: read
  issues: write
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == github.repository_owner && (github.event_name == 'issues' || github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/run-check'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect diagnostics and report to issue
        uses: actions/github-script@v7
        env:
          INPUT_DEPT: ${{ inputs.department || '' }}
          INPUT_ISSUE: ${{ inputs.issue_number || '' }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const issue=context.payload.issue;
            const issueNumber=issue?.number || Number(process.env.INPUT_ISSUE || 0);
            const title=issue?.title || '';
            const prefixes=[['[動画制作]','video'],['[動画フロー開発]','video-dev'],['[LINEスタンプ]','sticker'],['[LINE絵文字]','emoji'],['[iOSアプリ]','ios'],['[統括]','all']];
            const dept=context.eventName==='workflow_dispatch' ? process.env.INPUT_DEPT : (prefixes.find(([p])=>title.startsWith(p))?.[1] || 'all');
            if(!['video','video-dev','sticker','emoji','ios','all'].includes(dept)) throw Error('Invalid department');
            const lines=['## 🤖 AI制作本部・自動検査結果','','実行: '+new Date().toISOString(),'対象: '+dept,
              '処理: 読取専用の構造点検と結果の記録（コンテンツ生成、公開、申請、デプロイは行いません）',''];
            async function fetchFile(repoFull,path){
              const parts=repoFull.split('/');
              try{
                const res=await github.rest.repos.getContent({owner:parts[0],repo:parts[1],path});
                if(Array.isArray(res.data)||!res.data.content)return {error:'対象外のファイル形式'};
                return {content:Buffer.from(res.data.content,'base64').toString('utf8')};
              }catch(err){return {error:'HTTP '+(err.status||'unavailable')}}
            }
            async function check(name,repoFull,path,patterns){
              const result=await fetchFile(repoFull,path);
              if(result.error){lines.push('- ⚠️ '+name+'：読み取り不可 ('+result.error+')');return;}
              const missing=patterns.filter(([label,rx])=>!rx.test(result.content)).map(([label])=>label);
              lines.push('- '+(missing.length?'⚠️':'✅')+' '+name+'：'+(missing.length?'確認不足: '+missing.join('、'):'主要構造を確認')+' ('+result.content.length+'文字)');
            }
            let evaluated=0;
            if(dept==='sticker'||dept==='all'){
              evaluated++;
              await check('LINEスタンプ管理画面',owner+'/'+repo,'index.html',[
                ['HTML構造',/<html\b/i],['作品データ・ロジック',/project/i],['操作UI',/<button\b/i]]);
            }
            if(dept==='ios'||dept==='all'){
              evaluated++;
              await check('みんなの本棚プロトタイプ','growth1invest-bot/minna-no-hondana','index.html',[
                ['HTML構造',/<html\b/i],['本棚UI',/shelf/i],['切替操作',/data-type/i]]);
              lines.push('  - 注: 静的検査です。iOS実機テストではありません。');
            }
            if(dept==='emoji'||dept==='all')lines.push('- 🟠 LINE絵文字：ZIP実データ未添付。40個＋タブ画像の実ファイル検査は未実施。');
            if(dept==='video'||dept==='video-dev'||dept==='all')lines.push('- 🟠 YouTube：非公開動画リポジトリの制作・PR検証はこのワーカーでは実行しません。');
            if(dept==='all'){
              const open=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
              const tasks=open.filter(x=>!x.pull_request);
              lines.push('','### 仕事台帳','未完了：'+tasks.length+'件 / 承認待ち：'+tasks.filter(x=>x.labels.some(l=>l.name==='needs-approval')).length+'件 / 障害：'+tasks.filter(x=>x.labels.some(l=>l.name==='blocked')).length+'件');
            }
            lines.push('','### 実行結果',evaluated?'公開ソースの静的点検を実施。実際の制作・品質合格とは異なります。':'成果物の自動検査は未接続です。');
            lines.push('次の作業: 部署ごとに実ファイルの検査・修正ワーカーを接続する。');
            lines.push('ログ: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId);
            const report=lines.join('\n');
            await core.summary.addRaw(report).write();
            if(issueNumber && Number.isInteger(issueNumber) && issueNumber>0){
              const original=await github.rest.issues.get({owner,repo,issue_number:issueNumber});
              if(original.data.user?.login!==owner) throw Error('Issue must belong to repository owner');
              await github.rest.issues.createComment({owner,repo,issue_number:issueNumber,body:report});
            }
